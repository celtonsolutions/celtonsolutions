<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Phishing Awareness</title>
<style>
  :root{
    --blue:#1a73e8;
    --blue-dark:#1558b0;
    --text:#202124;
    --gray:#5f6368;
    --border:#dadce0;
    --bg:#ffffff;
    --page-bg:#f8f9fa;
    --error:#d93025;
    --success:#188038;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Google Sans','Segoe UI', Roboto, Arial, sans-serif;
    background:var(--page-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:48px 40px 36px;
    width:100%;
    max-width:400px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.05);
    position:relative;
    animation:cardIn .35s ease;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  .brand-logo{
    display:block;
    width:88px;
    height:auto;
    margin:0 auto 16px;
  }

  .title{
    font-size:24px;
    font-weight:500;
    color:var(--text);
    text-align:center;
    margin:0 0 8px;
  }
  .subtitle{
    font-size:14px;
    color:var(--gray);
    text-align:center;
    margin:0 0 24px;
  }

  .tab-row{
    display:flex;
    border-bottom:1px solid var(--border);
    margin-bottom:26px;
  }
  .tab-row button{
    flex:1;
    background:none;
    border:none;
    padding:10px 0;
    font-size:14px;
    font-weight:500;
    color:var(--gray);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-row button.active{
    color:var(--blue);
    border-bottom:2px solid var(--blue);
  }

  .field{
    position:relative;
    margin-bottom:22px;
  }
  .field input{
    width:100%;
    padding:13px 12px;
    font-size:15px;
    border:1px solid var(--border);
    border-radius:4px;
    outline:none;
    color:var(--text);
    background:transparent;
    transition:border-color .15s ease;
  }
  .field input:focus{
    border:2px solid var(--blue);
    padding:12px 11px;
  }
  .field label{
    position:absolute;
    left:12px;
    top:13px;
    font-size:15px;
    color:var(--gray);
    background:var(--bg);
    padding:0 4px;
    pointer-events:none;
    transition:all .15s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:-9px;
    font-size:12px;
    color:var(--blue);
  }

  .msg{
    font-size:13px;
    margin:-8px 0 16px;
    padding:10px 12px;
    border-radius:4px;
    display:none;
  }
  .msg.error{
    display:block;
    background:#fce8e6;
    color:var(--error);
  }
  .msg.success{
    display:block;
    background:#e6f4ea;
    color:var(--success);
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin-top:12px;
  }
  button.next{
    background:var(--blue);
    color:#fff;
    border:none;
    padding:10px 24px;
    font-size:14px;
    font-weight:500;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s ease, box-shadow .15s ease;
  }
  button.next:hover{
    background:var(--blue-dark);
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  button.next:active{
    transform:scale(.98);
  }
  button.next:disabled{background:#a8c7fa;cursor:not-allowed;}

  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--gray);
    margin-top:32px;
  }
  .hidden{display:none !important;}

  .spinner-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.9);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:999;
  }
  .spinner{
    width:40px;height:40px;
    border:4px solid #e0e0e0;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }
  .spinner-overlay p{
    color:var(--gray);
    font-size:13px;
    font-weight:500;
  }
</style>
</head>

  <h1 class="title" id="formTitle">Sign in</h1>
  <p class="subtitle" id="formSubtitle">to continue to Phishing Awareness</p>

  <div class="tab-row">
    <button id="loginTabBtn" class="active" onclick="switchTab('login')">Login</button>
    <button id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <form id="loginForm">
    <div class="field">
      <input type="email" id="loginEmail" placeholder=" " required>
      <label for="loginEmail">Email</label>
    </div>
    <div class="field">
      <input type="password" id="loginPassword" placeholder=" " required>
      <label for="loginPassword">Password</label>
    </div>

    <div class="msg" id="loginMsg"></div>

    <div class="actions">
      <button type="submit" class="next" id="loginBtn">Log In</button>
    </div>
  </form>

  <form id="signupForm" class="hidden">
    <div class="field">
      <input type="email" id="signupEmail" placeholder=" " required>
      <label for="signupEmail">Email</label>
    </div>
    <div class="field">
      <input type="password" id="signupPassword" placeholder=" " required minlength="6">
      <label for="signupPassword">Password (min 6 characters)</label>
    </div>

    <div class="msg" id="signupMsg"></div>

    <div class="actions">
      <button type="submit" class="next" id="signupBtn">Create Account</button>
    </div>
  </form>

  <p class="footer-note">Phishing Awareness Mini Games &middot; Learn to spot the red flags</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ============================================================
  // FIREBASE CONFIGURATION — replace with your own project config
  // Get this from: Firebase Console > Project Settings > General
  // ============================================================
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const REDIRECT_URL = "app.html";

  window.addEventListener('load', () => {
    document.getElementById('initSpinner').classList.add('hidden');
  });

  auth.onAuthStateChanged((user) => {
    if (user) {
      window.location.href = REDIRECT_URL;
    }
  });

  // ---------- Button click sound (synthesized, no external file needed) ----------
  let audioCtx;
  function playClickSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) {
      // Audio not supported/blocked — fail silently
    }
  }
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', playClickSound);
  });

  function switchTab(tab) {
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginTabBtn = document.getElementById('loginTabBtn');
    const signupTabBtn = document.getElementById('signupTabBtn');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');

    document.getElementById('loginMsg').className = 'msg';
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('signupMsg').className = 'msg';
    document.getElementById('signupMsg').textContent = '';

    if (tab === 'login') {
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      loginTabBtn.classList.add('active');
      signupTabBtn.classList.remove('active');
      formTitle.textContent = 'Sign in';
      formSubtitle.textContent = 'to continue to Phishing Awareness';
    } else {
      loginForm.classList.add('hidden');
      signupForm.classList.remove('hidden');
      loginTabBtn.classList.remove('active');
      signupTabBtn.classList.add('active');
      formTitle.textContent = 'Create account';
      formSubtitle.textContent = 'to join Phishing Awareness';
    }
  }

  function showMessage(boxId, text, type) {
    const box = document.getElementById(boxId);
    box.textContent = text;
    box.className = 'msg ' + type;
  }

  function friendlyError(error) {
    const map = {
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password. Please try again.',
      'auth/email-already-in-use': 'An account with this email already exists.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/invalid-credential': 'Invalid email or password.',
      'auth/too-many-requests': 'Too many attempts. Please try again later.'
    };
    return map[error.code] || error.message;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      await auth.signInWithEmailAndPassword(email, password);
      showMessage('loginMsg', 'Login successful! Redirecting...', 'success');
      window.location.href = REDIRECT_URL;
    } catch (error) {
      showMessage('loginMsg', friendlyError(error), 'error');
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const btn = document.getElementById('signupBtn');

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);

      await db.collection('users').doc(cred.user.uid).set({
        email: email,
        score: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showMessage('signupMsg', 'Account created! Redirecting...', 'success');
      window.location.href = REDIRECT_URL;
    } catch (error) {
      showMessage('signupMsg', friendlyError(error), 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>
